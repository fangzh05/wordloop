name: WordLoop Design Source Screenshots
on:
  push:
    branches:
      - design/wordloop-editorial-refresh-20261010
      - design/feedback-clean-reading-20261011
  pull_request:
    branches:
      - codex/lexical-root-network
      - feat/cloudflare-workers-production
  workflow_dispatch:
jobs:
  visual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build:web
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/visual-review/build.mjs
      - name: Render requested UI states
        run: node scripts/visual-review/render.mjs
        env:
          VISUAL_PAGES: relearn-lesson,relearn-lesson-dark,relearn-exercise,pretest,pretest-dark,pretest-wrong,study,lesson,lesson-dark,lesson-exercise,lesson-feedback,lesson-feedback-retry,lesson-feedback-loading
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wordloop-source-rendered-ui
          path: scripts/visual-review/screenshots/
          if-no-files-found: warn
